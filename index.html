<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#05080d">
  <title>Democrat – The Game</title>
  <link rel="icon" type="image/svg+xml" href="./assets/democrat-icon.svg?v=20261001-3">
  <link rel="manifest" href="./manifest.webmanifest?v=20261001-3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./assets/democrat-icon.svg?v=20261001-3">
  <link rel="stylesheet" href="./modules/splash/splash.css?v=20261001-3">
  <link rel="stylesheet" href="./modules/legal/legal.css?v=20260930-3">
  <link rel="stylesheet" href="./modules/auth/auth.css?v=20260930-3">
  <link rel="stylesheet" href="./modules/overview/overview.css?v=20260930-6">
  <link rel="stylesheet" href="./modules/session/session.css?v=20261001-30">
  <link rel="stylesheet" href="./modules/country/country.css?v=20260930-1">
</head>
<body>
  <main id="app">
    <section id="splash-app" aria-label="Donnerfaust Gaming">
      <div class="splash-sequence" role="status" aria-label="Democrat – The Game">
        <div class="publisher-splash">
          <div class="publisher-mark">DONNERFAUST</div>
          <div class="publisher-sub">INTERACTIVE</div>
        </div>
        <div class="game-splash" hidden>
          <img class="game-logo splash-logo" src="./assets/democrat-logo.svg?v=20261001-3" alt="Democrat – The Game">
        </div>
        <div class="splash-error" hidden>
          <strong>Democrat – The Game</strong>
          <span>Das Spiel konnte nicht geladen werden.</span>
          <button type="button" data-reload>Neu laden</button>
        </div>
      </div>
    </section>
    <section id="legal-app" aria-label="Rechtliche Hinweise" hidden></section>
    <section id="auth-app" aria-label="Democrat – The Game Anmeldung" hidden></section>
    <section id="overview-app" aria-label="Democrat – The Game Übersicht" hidden></section>
    <section id="session-app" aria-label="Parlamentssitzung" hidden></section>
    <section id="country-app" aria-label="Länderauswahl" hidden></section>
  </main>

  <script type="module">
    const splash = document.querySelector("#splash-app");
    const sequence = splash?.querySelector(".splash-sequence");
    const publisher = splash?.querySelector(".publisher-splash");
    const game = splash?.querySelector(".game-splash");
    const errorBox = splash?.querySelector(".splash-error");

    const wait = (ms) => new Promise(resolve => window.setTimeout(resolve, ms));

    function showBootError(error) {
      console.error("[Democrat] Boot error:", error);
      if (publisher) publisher.hidden = true;
      if (game) game.hidden = true;
      if (errorBox) {
        errorBox.hidden = false;
        const details = document.createElement("small");
        details.textContent = error?.message || String(error);
        details.style.cssText = "max-width:min(90vw,560px);color:#7f8da3;word-break:break-word";
        errorBox.appendChild(details);
      }
    }

    splash?.querySelector("[data-reload]")?.addEventListener("click", () => window.location.reload());

    async function boot() {
      try {
        await wait(1200);

        publisher?.classList.add("publisher-out");
        await wait(450);
        if (publisher) publisher.hidden = true;

        if (game) {
          game.hidden = false;
          game.classList.add("game-in");
        }

        await wait(1400);

        // Start the actual application directly from the document boot.
        // This removes the splash module as a single point of failure.
        await import("./modules/legal/legal.js?v=20261001-3");

        const legal = document.querySelector("#legal-app");
        const auth = document.querySelector("#auth-app");
        const overview = document.querySelector("#overview-app");
        const session = document.querySelector("#session-app");

        if (!(legal && !legal.hidden) && !(auth && !auth.hidden) && !(overview && !overview.hidden) && !(session && !session.hidden)) {
          await wait(1000);
        }

        sequence?.classList.add("splash-fade-out");
        await wait(500);
        splash?.remove();
      } catch (error) {
        showBootError(error);
      }
    }

    window.addEventListener("error", event => {
      if (event.error) showBootError(event.error);
    });
    window.addEventListener("unhandledrejection", event => {
      if (event.reason) showBootError(event.reason);
    });

    boot();
  </script>
</body>
</html>
