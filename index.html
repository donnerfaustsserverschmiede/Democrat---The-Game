<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0757a6">
  <title>Democrat – The Game</title>
  <link rel="icon" type="image/svg+xml" href="./assets/democrat-icon.svg?v=20261001-8">
  <link rel="manifest" href="./manifest.webmanifest?v=20261001-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./assets/democrat-icon.svg?v=20261001-7">
  <link rel="stylesheet" href="./modules/splash/splash.css?v=20261001-7">
  <link rel="stylesheet" href="./modules/legal/legal.css?v=20260930-3">
  <link rel="stylesheet" href="./modules/auth/auth.css?v=20261001-5">
  <link rel="stylesheet" href="./modules/overview/overview.css?v=20261001-35">
  <link rel="stylesheet" href="./modules/player/player.css?v=20261001-1">
  <link rel="stylesheet" href="./modules/party/party.css?v=20261001-1">
  <link rel="stylesheet" href="./modules/session/session.css?v=20261001-32">
  <link rel="stylesheet" href="./modules/country/country.css?v=20261001-3">
</head>
<body>
  <main id="app">
    <section id="splash-app" aria-label="Donnerfaust Interactive">
      <div class="splash-sequence" role="status" aria-label="Donnerfaust Interactive und Democrat – The Game">
        <div class="publisher-splash">
          <div class="publisher-mark">Donnerfaust Interactive</div>
        </div>
        <div class="game-splash" hidden>
          <img class="game-logo splash-logo" src="./assets/democrat-logo.svg?v=20261001-9" alt="Democrat – The Game">
        </div>
      </div>
    </section>
    <section id="legal-app" aria-label="Rechtliche Hinweise" hidden></section>
    <section id="auth-app" aria-label="Democrat – The Game Anmeldung" hidden></section>
    <section id="overview-app" aria-label="Democrat – The Game Übersicht" hidden></section>
    <section id="session-app" aria-label="Parlamentssitzung" hidden></section>
    <section id="country-app" aria-label="Länderauswahl" hidden></section>
  </main>

  <script type="module">
    const splash = document.querySelector("#splash-app");
    const sequence = splash?.querySelector(".splash-sequence");
    const publisher = splash?.querySelector(".publisher-splash");
    const game = splash?.querySelector(".game-splash");
    const wait = (ms) => new Promise(resolve => window.setTimeout(resolve, ms));

    async function boot() {
      try {
        await wait(1800);
        publisher?.classList.add("publisher-out");
        await wait(500);
        if (publisher) publisher.hidden = true;

        if (game) {
          game.hidden = false;
          game.classList.add("game-in");
        }

        await wait(1800);
        await import("./modules/legal/legal.js?v=20261001-8");

        const legal = document.querySelector("#legal-app");
        const auth = document.querySelector("#auth-app");
        const overview = document.querySelector("#overview-app");
        const session = document.querySelector("#session-app");

        if (!(legal && !legal.hidden) && !(auth && !auth.hidden) && !(overview && !overview.hidden) && !(session && !session.hidden)) {
          await wait(300);
        }

        splash?.remove();
      } catch (error) {
        console.error("[Democrat] Boot error:", error);
        const text = document.createElement("div");
        text.className = "splash-error";
        text.innerHTML = "<strong>Democrat – The Game</strong><span>Das Spiel konnte nicht geladen werden.</span><button type=\"button\">Neu laden</button>";
        text.querySelector("button")?.addEventListener("click", () => window.location.reload());
        sequence?.appendChild(text);
      }
    }

    boot();
  </script>
</body>
</html>
