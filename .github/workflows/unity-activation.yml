name: Check Unity Personal License

on:
  workflow_dispatch:

jobs:
  activation:
    name: Activate Unity Personal
    runs-on: ubuntu-latest
    steps:
      - name: Install Unity Hub and Editor
        uses: buildalon/unity-setup@v2
        with:
          version-file: Unity/ProjectSettings/ProjectVersion.txt
          unity-version: 6000.3.0f1
          cache-installation: true

      - name: Activate Unity Personal license
        uses: buildalon/activate-unity-license@v2.2.2
        with:
          license: Personal
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Verify Unity license
        run: |
          echo "Unity Personal license activation completed successfully."
