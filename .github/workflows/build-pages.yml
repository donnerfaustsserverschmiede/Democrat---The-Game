name: Build Unity WebGL and publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Unity/**"
      - ".github/workflows/build-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Unity WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Unity
          unityVersion: 6000.3.0f1
          targetPlatform: WebGL
          buildMethod: DemocratWebGLBuild.BuildWebGL

      - name: Prepare Pages package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages
          mkdir -p pages
          cp -R Unity/Build/WebGL/. pages/
          cat > pages/index.html <<'EOF'
          <!doctype html>
          <html lang="de">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
            <title>Democrat - The Game</title>
            <style>
              html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#080b10; }
              #unity-container { width:100%; height:100%; }
              #unity-canvas { width:100%; height:100%; background:#080b10; }
            </style>
          </head>
          <body>
            <div id="unity-container"><canvas id="unity-canvas"></canvas></div>
            <script>
              const canvas = document.getElementById("unity-canvas");
              const buildUrl = ".";
              const config = {
                dataUrl: buildUrl + "/WebGL.data",
                frameworkUrl: buildUrl + "/WebGL.framework.js",
                codeUrl: buildUrl + "/WebGL.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Donnerfaust Gaming",
                productName: "Democrat - The Game",
                productVersion: "0.1.0"
              };
              const s = document.createElement("script");
              s.src = buildUrl + "/WebGL.loader.js";
              s.onload = () => {
                createUnityInstance(canvas, config, () => {}).catch(err => {
                  document.body.innerHTML = "<pre style='color:white;padding:20px'>Unity konnte nicht gestartet werden. " + err + "</pre>";
                });
              };
              document.body.appendChild(s);
            </script>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
