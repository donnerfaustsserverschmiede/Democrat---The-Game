name: Build and publish Democrat to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "modules/**"
      - "manifest.webmanifest"
      - "fonts/**"
      - "data/**"
      - ".github/workflows/build-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pages
          mkdir -p pages

          cp index.html pages/
          if [ -d assets ]; then cp -R assets pages/; fi
          if [ -d modules ]; then cp -R modules pages/; fi
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest pages/; fi
          if [ -d fonts ]; then cp -R fonts pages/; fi
          if [ -d data ]; then cp -R data pages/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
